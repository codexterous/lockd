name: FreeBSD native tests

on:
  workflow_call:
    inputs:
      reuse_checks:
        description: Reuse successful compatibility jobs for this exact commit and version
        type: boolean
        default: false
      source_version:
        description: Version of the release_source artifact
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: FreeBSD ${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
    uses: ./.github/workflows/freebsd_architectures.yml
    with:
      release: ${{ matrix.release }}
      source_version: ${{ inputs.source_version }}
      reuse_checks: ${{ inputs.reuse_checks }}
