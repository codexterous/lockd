name: Release Windows

on:
  workflow_call:
    inputs:
      reuse_checks:
        description: Reuse successful compatibility jobs for this exact commit and version
        type: boolean
        default: false
      source_version:
        description: Release source artifact version; empty tests the checked-out commit
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  OUTPUT_ARCH: x86_64
  LOCKD_HOST_BUILD_DIR: ${{ github.workspace }}/output/obj/x86_64/opt/shared
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    name: ${{ matrix.arch }} (opt, ${{ matrix.linkage }})
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64, arm64]
        linkage: [static, shared]
    env:
      OUTPUT_ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
      LOCKD_HOST_BUILD_DIR: ${{ github.workspace }}/output/obj/${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}/opt/shared
      # Match the supported v143 toolset used by the ARM64 wheel builds.
      LOCKD_MSVC_TOOLSET_VERSION: ${{ matrix.arch == 'arm64' && '14.44' || '' }}
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_LINKAGE: ${{ matrix.linkage }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out Windows test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reuse successful compatibility result
        id: reuse
        if: inputs.reuse_checks
        uses: ./.github/actions/reuse_compatibility
        with:
          version: ${{ inputs.source_version }}
          job: Compatibility Testing - Windows / ${{ matrix.arch }} (opt, ${{ matrix.linkage }})
          artifact: ${{ matrix.linkage == 'static' && format('release_windows_{0}', matrix.arch) || '' }}
      - name: Use the checkout for Windows tests
        if: steps.reuse.outputs.reused != 'true' && (inputs.source_version == '')
        run: '"BUILD_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV'
      - name: Set up CPython 3.14
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Download source tarball
        if: steps.reuse.outputs.reused != 'true' && (inputs.source_version != '')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release_source
          path: output/${{ env.OUTPUT_ARCH }}/opt/static
      - name: Extract the release source
        if: steps.reuse.outputs.reused != 'true' && (inputs.source_version != '')
        env:
          RELEASE_VERSION: ${{ inputs.source_version }}
        run: |
          New-Item -ItemType Directory -Force output/obj/${{ env.OUTPUT_ARCH }}/opt/shared/source | Out-Null
          tar -xzf "output/${{ env.OUTPUT_ARCH }}/opt/static/lockd-$env:RELEASE_VERSION.tar.gz" -C output/obj/${{ env.OUTPUT_ARCH }}/opt/shared/source
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed.' }
          $buildRoot = Join-Path $PWD "output/obj/${{ env.OUTPUT_ARCH }}/opt/shared/source/lockd-$env:RELEASE_VERSION"
          "BUILD_ROOT=$buildRoot" >> $env:GITHUB_ENV
      - name: Identify the native Windows toolchain
        if: steps.reuse.outputs.reused != 'true'
        id: toolchain
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          . ./scripts/release/windows_environment.ps1 -Architecture $env:BUILD_ARCH
          $compilerHash = (Get-FileHash -LiteralPath (Get-Command cl.exe).Source -Algorithm SHA256).Hash
          $cmakeVersion = (& cmake --version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify CMake for the dependency cache.' }
          $powerShellVersion = $PSVersionTable.PSVersion.ToString()
          # vcpkg's ABI includes build tools too. Runner images can change those without
          # changing cl.exe, the SDK version, or the Windows kernel version.
          $identity = "$compilerHash|$env:VCToolsVersion|$env:WindowsSDKVersion|$([Environment]::OSVersion.Version)|$cmakeVersion|$powerShellVersion|$env:ImageVersion"
          Write-Output "Native dependency tools: $cmakeVersion; PowerShell $powerShellVersion; runner image $env:ImageVersion"
          $hash = [System.Security.Cryptography.SHA256]::Create()
          try {
              $digest = [Convert]::ToHexString($hash.ComputeHash([Text.Encoding]::UTF8.GetBytes($identity)))
          }
          finally { $hash.Dispose() }
          "digest=$digest" >> $env:GITHUB_OUTPUT
      - name: Restore Windows build dependencies
        if: steps.reuse.outputs.reused != 'true'
        id: native_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: output/obj/${{ env.OUTPUT_ARCH }}/opt/shared/cache/native
          key: native-windows-v2-${{ matrix.arch }}-${{ matrix.linkage }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('output/obj/*/opt/shared/source/**/vcpkg.json', 'output/obj/*/opt/shared/source/**/lockd_toolchain.cmake', 'vcpkg.json', 'cmake/lockd_toolchain.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Cache entries are immutable. Prefer the newest matching snapshot, with legacy
          # keys as a fallback; vcpkg still checks each restored package's actual ABI.
          restore-keys: |
            native-windows-v2-${{ matrix.arch }}-${{ matrix.linkage }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('output/obj/*/opt/shared/source/**/vcpkg.json', 'output/obj/*/opt/shared/source/**/lockd_toolchain.cmake', 'vcpkg.json', 'cmake/lockd_toolchain.cmake') }}-
            native-windows-v2-${{ matrix.arch }}-${{ matrix.linkage }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('output/obj/*/opt/shared/source/**/vcpkg.json', 'output/obj/*/opt/shared/source/**/lockd_toolchain.cmake', 'vcpkg.json', 'cmake/lockd_toolchain.cmake') }}
            native-windows-v2-${{ matrix.arch }}-${{ matrix.linkage }}-
      - name: Record restored native dependency contents
        if: steps.reuse.outputs.reused != 'true'
        id: native_cache_state
        run: |
          # Only new downloads or binary variants should create another cache snapshot.
          "digest=${{ hashFiles('output/obj/*/opt/shared/cache/native/**') }}" >> $env:GITHUB_OUTPUT
      - name: Configure native dependencies
        if: steps.reuse.outputs.reused != 'true'
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          . ./scripts/release/windows_environment.ps1 -Architecture $env:BUILD_ARCH
          $cache = Join-Path $env:GITHUB_WORKSPACE 'output/obj/${{ env.OUTPUT_ARCH }}/opt/shared/cache/native'
          & (Join-Path $env:BUILD_ROOT 'scripts/release/windows_vcpkg_cache.ps1') -Operation Restore -CacheDirectory $cache
          Write-Host "vcpkg installation: $env:VCPKG_ROOT"
          $preset = "$env:BUILD_ARCH-opt-$env:BUILD_LINKAGE"
          $arguments = @('--preset', $preset, '-DLOCKD_BUILD_PYTHON=OFF', '-DLOCKD_CLANG_TIDY=OFF', '-DLOCKD_CLANG_TIDY_WARNINGS_AS_ERRORS=ON')
          if ($env:BUILD_ARCH -eq 'arm64') {
              # The runner also has VS 2026. Keep dependency builds in the v143
              # environment selected above, which Boost 1.88 supports.
              $arguments += @('-DLOCKD_VCPKG_COMPILER_ENVIRONMENT=ON', '-DLOCKD_VCPKG_PLATFORM_TOOLSET=v143')
          }
          Invoke-Checked cmake $arguments
      - name: Collect completed native dependency downloads and binaries
        id: collect_native
        if: steps.reuse.outputs.reused != 'true' && always() && steps.native_cache.outputs.cache-primary-key != ''
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'output/obj/${{ env.OUTPUT_ARCH }}/opt/shared/cache/native'
          & (Join-Path $env:BUILD_ROOT 'scripts/release/windows_vcpkg_cache.ps1') -Operation Collect -CacheDirectory $cache
      - name: Save compiled native dependencies before testing
        if: steps.reuse.outputs.reused != 'true' && always() && steps.collect_native.outcome == 'success' && hashFiles('output/obj/*/opt/shared/cache/native/**') != '' && hashFiles('output/obj/*/opt/shared/cache/native/**') != steps.native_cache_state.outputs.digest
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: output/obj/${{ env.OUTPUT_ARCH }}/opt/shared/cache/native
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Preserve native dependency ABI diagnostics
        if: steps.reuse.outputs.reused != 'true' && always() && steps.native_cache_state.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows_${{ matrix.arch }}_${{ matrix.linkage }}_dependency_abi
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees/**/*.vcpkg_abi_info.txt
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees/detect_compiler/**/*.log
            ${{ env.BUILD_ROOT }}/output/obj/${{ matrix.arch }}/opt/${{ matrix.linkage }}/vcpkg-manifest-install.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Build and test executables
        if: steps.reuse.outputs.reused != 'true'
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          . ./scripts/release/windows_environment.ps1 -Architecture $env:BUILD_ARCH
          $preset = "$env:BUILD_ARCH-opt-$env:BUILD_LINKAGE"
          $build = "output/obj/$env:BUILD_ARCH/opt/$env:BUILD_LINKAGE"
          $buildJobs = '2'
          Invoke-Checked cmake @("-DLOCKD_BUILD_JOBS=$buildJobs", '-P', 'cmake/lockd_report_build_cpus.cmake')
          Invoke-Checked cmake @('--build', $build, '--target', 'lockd_test', '--parallel', $buildJobs)
          Invoke-Checked cmake @('--build', $build, '--target', 'lockd_test', '--parallel', $buildJobs)
          Invoke-Checked ctest @('--preset', $preset, '--no-tests=error', '--parallel', '2', '-E', '^lockd_clang_tidy_')
      - name: Preserve build and test diagnostics
        if: steps.reuse.outputs.reused != 'true' && (failure())
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows_${{ matrix.arch }}_${{ matrix.linkage }}_diagnostics
          path: |
            ${{ env.BUILD_ROOT }}/output/obj/${{ matrix.arch }}/opt/${{ matrix.linkage }}/Testing/Temporary/
            ${{ env.BUILD_ROOT }}/output/obj/${{ matrix.arch }}/opt/${{ matrix.linkage }}/vcpkg-manifest-install.log
            ${{ env.BUILD_ROOT }}/output/obj/${{ matrix.arch }}/opt/${{ matrix.linkage }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore
      - name: Package standalone Windows executables
        if: steps.reuse.outputs.reused != 'true' && (matrix.linkage == 'static')
        working-directory: ${{ env.BUILD_ROOT }}
        run: python scripts/release/package.py windows --architecture "$env:BUILD_ARCH"
      - name: Build Windows installer
        if: steps.reuse.outputs.reused != 'true' && (matrix.linkage == 'static')
        working-directory: ${{ env.BUILD_ROOT }}
        run: ./scripts/release/build_windows_installer.ps1 -Architecture $env:BUILD_ARCH
      - name: Test Windows installer lifecycle
        if: steps.reuse.outputs.reused != 'true' && (matrix.linkage == 'static')
        working-directory: ${{ env.BUILD_ROOT }}
        run: ./scripts/release/test_windows_installer.ps1 -Architecture $env:BUILD_ARCH
      - name: Preserve installer lifecycle diagnostics
        if: steps.reuse.outputs.reused != 'true' && failure() && matrix.linkage == 'static'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows_${{ matrix.arch }}_installer_diagnostics
          path: ${{ env.BUILD_ROOT }}/output/obj/${{ matrix.arch }}/opt/static/verifications/installer_lifecycle/
          if-no-files-found: ignore
      - name: Upload Windows portable and installer downloads
        if: steps.reuse.outputs.reused != 'true' && (matrix.linkage == 'static')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release_windows_${{ matrix.arch }}
          retention-days: 14
          path: |
            ${{ env.BUILD_ROOT }}/output/${{ matrix.arch }}/opt/static/*.zip
            ${{ env.BUILD_ROOT }}/output/${{ matrix.arch }}/opt/static/*-setup.exe
          if-no-files-found: error

